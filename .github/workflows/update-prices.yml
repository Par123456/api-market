name: Update Crypto Prices

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch and save prices
        run: |
          python fetch_prices.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes
          if git diff --quiet prices.txt; then
            echo "No price changes detected"
          else
            git add prices.txt
            git commit -m "Update crypto prices: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "Prices updated and pushed"
          fi